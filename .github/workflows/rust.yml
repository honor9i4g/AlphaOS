name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format and build UEFI target
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add x86_64-unknown-uefi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build UEFI application
        run: cargo build --release --target x86_64-unknown-uefi --workspace

      - name: Prepare EFI System Partition files
        shell: bash
        run: |
          mkdir -p esp/EFI/BOOT
          cp target/x86_64-unknown-uefi/release/AlphaOS-Bootloader.efi esp/EFI/BOOT/BOOTX64.EFI
          cp target/x86_64-unknown-uefi/release/AlphaOS-Kernel.efi esp/EFI/BOOT/ALPHAKRN.EFI

      - name: Upload bootable EFI files
        uses: actions/upload-artifact@v4
        with:
          name: alphaos-uefi
          path: esp/EFI/BOOT/
